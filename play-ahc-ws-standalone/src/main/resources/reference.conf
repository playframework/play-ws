play {
  ws {
    # Configuration specific to the Ahc implementation of the WS client
    ahc {
      # Pools connections.  Replaces setAllowPoolingConnections and setAllowPoolingSslConnections.
      keepAlive = true

      # The maximum number of connections to make per host. -1 means no maximum.
      maxConnectionsPerHost = -1

      # The maximum total number of connections. -1 means no maximum.
      maxConnectionsTotal = -1

      # Whether AHC may use HTTP/2. Play WS does not yet offer HTTP/2 over HTTPS.
      # Cleartext h2c also requires enabling AHC's http2CleartextEnabled through modifyUnderlying.
      http2Enabled = false

      # The HTTP/2 per-stream flow-control window in bytes. A suspended response can buffer roughly this much received
      # data; with automatic decompression, a compressed response can inflate into much more decoded data.
      # Must be greater than 0: a zero initial window can prevent a response stream from making initial progress.
      # If null, use the AHC default (16777216, or 16 MiB).
      http2InitialWindowSize = null

      # The maximum number of concurrent HTTP/2 streams per connection. Together with http2InitialWindowSize, this
      # limits the received data buffered per connection for suspended responses; decoded data from compressed
      # responses can be much larger. If null, use the AHC default (-1, server-controlled), which does not impose a
      # client-side cap. A finite client-wide policy also requires finite connection limits.
      http2MaxConcurrentStreams = null

      # The maximum size of one decompressed response for both HTTP/1.1 and HTTP/2. If null, use the AHC defaults.
      # Setting this to 0 disables decompression-bomb protection and is not recommended for untrusted responses.
      maxDecompressedResponseSize = null

      # The maximum number of redirects.
      maxNumberOfRedirects = 5

      # The maximum number of times to retry a request if it fails.
      maxRequestRetry = 5

      # If non null, the maximum time that a connection should live for in the pool.
      maxConnectionLifetime = null

      # If non null, the time after which a connection that has been idle in the pool should be closed.
      idleConnectionInPoolTimeout = 1 minute

      # If non null, the frequency to cleanup timeout idle connections
      connectionPoolCleanerPeriod = 1 second

      # Whether the raw URL should be used.
      disableUrlEncoding = false

      # Whether to use LAX(no cookie name/value verification) or STRICT (verifies cookie name/value) cookie decoder
      useLaxCookieEncoder = false

      # Whether to use a cookie store
      useCookieStore = false

      # The quiet period used when shutting down AHC's event loop. It must be non-negative and no greater than
      # shutdownTimeout. Play WS keeps its existing immediate-shutdown behavior by default.
      shutdownQuietPeriod = 0 milliseconds

      # The maximum time allowed when shutting down AHC's event loop. It must be non-negative and greater than or
      # equal to shutdownQuietPeriod; increase both settings when configuring a positive quiet period.
      shutdownTimeout = 0 milliseconds
    }
  }
}
